[package]
name = "ssh_home"
version = "0.0.0"
loft = ">=0.8"

# A pure-loft native terminal (PLAN.md). Rendering goes through loft's graphics
# library's CPU Canvas (deterministic + headless for golden tests; the live app
# uploads the same Canvas to GL). The input-event queue this app needs lands in
# graphics 0.4.0 (Gap 01) — Step 0 only needs the Canvas + text primitives, so
# >=0.3 is enough here; bump to >=0.4 at PLAN Step 2.
[dependencies]
# graphics 0.4.2: the Gap-01 input-event queue + the save_png/rasterize bridges,
# the Canvas write-propagation fix (&self.data), the --native window fix, and the
# loft 2026.7.1 warning cleanup (retired `not null` removed, sqrt `float?` and the
# group_vbos `&` params discharged) so consuming it stays warning-free.
graphics = ">=0.4.2"
# ssh 0.1.0: the russh transport (connect/login/open_shell/send/recv/resize/close).
# Used by tools/ssh_smoke.loft (Step 4 live test); wired into the app loop in Step 5.
# main.loft does NOT import ssh yet, so the golden/unit runs don't build its cdylib.
ssh = ">=0.1.0"
